name: Android CI and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Android release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/sevai-release.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            : "${KEYSTORE_PASSWORD_SECRET:?ANDROID_KEYSTORE_PASSWORD is required when using ANDROID_KEYSTORE_BASE64}"
            : "${KEY_ALIAS_SECRET:?ANDROID_KEY_ALIAS is required when using ANDROID_KEYSTORE_BASE64}"
            : "${KEY_PASSWORD_SECRET:?ANDROID_KEY_PASSWORD is required when using ANDROID_KEYSTORE_BASE64}"
            echo "Using the configured repository signing key."
            KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD_SECRET"
            KEY_ALIAS="$KEY_ALIAS_SECRET"
            KEY_PASSWORD="$KEY_PASSWORD_SECRET"
          else
            echo "ANDROID_KEYSTORE_BASE64 is not configured; generating a temporary signing key for this build."
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_ALIAS="sevai-release"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Sevai.app, O=Sevai.app, C=IN"
          fi

          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
